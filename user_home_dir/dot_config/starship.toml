"$schema" = 'https://starship.rs/config-schema.json'

format = """
[](#C8281C)\
$os\
$username\
[](bg:#4A4A4D fg:#C8281C)\
$directory\
[](fg:#4A4A4D bg:#6E7074)\
$git_branch\
$git_status\
[](fg:#6E7074 bg:#B8BABE)\
$c\
$elixir\
$elm\
$golang\
$gradle\
$haskell\
$java\
$julia\
$maven\
$nodejs\
$bun\
$nim\
$rust\
$scala\
[](fg:#B8BABE bg:#E8E9EB)\
$docker_context\
[](fg:#E8E9EB bg:#C8281C)\
$time\
[ ](fg:#C8281C)\
"""

# Disable the blank line at the start of the prompt
# add_newline = false

# You can also replace your username with a neat symbol like   or disable this
# and use the os module below
[username]
show_always = true
style_user = "bg:#C8281C"
style_root = "bg:#C8281C"
# format = '[$user ]($style)'
format = '[ 𝕞𝕒𝕣𝕔 ]($style)'
disabled = false

# An alternative to the username module which displays a symbol that
# represents the current operating system
[os]
style = "bg:#C8281C"
disabled = true # Disabled by default

[directory]
style = "bg:#4A4A4D"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

# Here is how you can shorten some long paths by text replacement
# similar to mapped_locations in Oh My Posh:
[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "
# Keep in mind that the order matters. For example:
# "Important Documents" = " 󰈙 "
# will not be replaced, because "Documents" was already substituted before.
# So either put "Important Documents" before "Documents" or use the substituted version:
# "Important 󰈙 " = " 󰈙 "

[c]
symbol = " "
style = "bg:#B8BABE"
format = '[ $symbol ($version) ]($style)'

[cpp]
symbol = " "
style = "bg:#B8BABE"
format = '[ $symbol ($version) ]($style)'

[docker_context]
symbol = " "
style = "bg:#E8E9EB"
format = '[ $symbol $context ]($style)'

[elixir]
symbol = " "
style = "bg:#B8BABE"
format = '[ $symbol ($version) ]($style)'

[elm]
symbol = " "
style = "bg:#B8BABE"
format = '[ $symbol ($version) ]($style)'

[git_branch]
symbol = ""
style = "bg:#6E7074"
format = '[ $symbol $branch ]($style)'

[git_status]
style = "bg:#6E7074"
format = '[$all_status$ahead_behind ]($style)'

[golang]
symbol = " "
style = "bg:#B8BABE"
format = '[ $symbol ($version) ]($style)'

[gradle]
style = "bg:#B8BABE"
format = '[ $symbol ($version) ]($style)'

[haskell]
symbol = " "
style = "bg:#B8BABE"
format = '[ $symbol ($version) ]($style)'

[java]
symbol = " "
style = "bg:#B8BABE"
format = '[ $symbol ($version) ]($style)'

[julia]
symbol = " "
style = "bg:#B8BABE"
format = '[ $symbol ($version) ]($style)'

[maven]
style = "bg:#B8BABE"
format = '[ $symbol ($version) ]($style)'

[nodejs]
symbol = ""
style = "bg:#B8BABE"
format = '[ $symbol ($version) ]($style)'

[bun]
symbol = ""
style = "bg:#B8BABE"
format = '[ $symbol ($version) ]($style)'

[nim]
symbol = "󰆥 "
style = "bg:#B8BABE"
format = '[ $symbol ($version) ]($style)'

[rust]
symbol = ""
style = "bg:#B8BABE"
format = '[ $symbol ($version) ]($style)'

[scala]
symbol = " "
style = "bg:#B8BABE"
format = '[ $symbol ($version) ]($style)'

[time]
disabled = false
time_format = "%R" # Hour:Minute Format
style = "bg:#C8281C"
format = '[ ⚡ $time ]($style)'
